# === THEME ===
# statusbar
set -g status-style fg=colour250,bg=default

# default window
setw -g window-status-style fg=white,dim,bg=default
setw -g window-status-format '[#I] #W '

# active window
setw -g window-status-current-style fg=white,bold,bg=default
setw -g window-status-current-format '[#I] #W '
setw -g window-status-activity-style fg=gold,bg=default

# pane borders
set -g pane-border-style fg=colour237
set -g pane-active-border-style fg=colour242

# messages
set -g message-style fg=white,bg=default

# pane number display
set -g display-panes-active-colour colour250
set -g display-panes-colour colour240

# clock
setw -g clock-mode-colour white

# copy mode highlight
setw -g mode-style fg=white,bright,bg=colour236


# === STATUS ===
set -g status-interval 1
set -g status-justify centre
set -g status-keys vi
set -g status-position bottom
set -g display-time 1000

# status left
set -g status-left-length 40
set -g status-left "#[fg=colour16,bg=white,bold] #S #[fg=white,bg=colour238] #H #[bg=default] "

# status right
set -g status-right-length 40
set -g status-right "#[fg=default] %a %m/%d/%y %H:%M"


# === CONFIG ===
# window splitting
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"

# mouse
set -g mouse on

# remap prefix to C-a
set -g prefix C-a
bind C-a last-window

# start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# history
set -g history-limit 50000

# faster key repetition
set -s escape-time 0

# restricts window size to max size of clients on current window, instead of session
setw -g aggressive-resize on

# allows us to propogate prefix into further tmux sessions
bind a send-prefix
bind C-a last-window
bind -n C-b send-prefix

# activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# vi pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# quick window switching
bind C-p previous-window
bind C-n next-window

# switch panes using alt-vim without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind C command-prompt -p "New session:" "new-window -n '%%'"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# auto window rename
setw -g automatic-rename on

# vi copypaste mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# set 256color
set -g default-terminal "tmux-256color"

